# cargo about generate about.hbs -o ../app/build/notices/rust-licenses.txt  (helper 의 Rust 크레이트 라이선스 전문 -> THIRD_PARTY_NOTICES)
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Unicode-DFS-2016", "BSD-3-Clause", "ISC", "Zlib"]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# windows-rs 의 license-mit 는 들여쓰기돼 있어 저절로 읽히지 않는다. Microsoft 저작권이 든 원문을 쓰게 알려 준다
[windows.clarify]
license = "MIT OR Apache-2.0"
[[windows.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

